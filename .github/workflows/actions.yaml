name: Run Email Engine

on:
  schedule:
    - cron: '*/5 * * * *' # Runs every 5 minutes (Change to '0 6 * * *' for 8:00 AM Egypt Time)
  workflow_dispatch: # Enables manual execution button in GitHub Actions UI

jobs:
  run-script:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from Secret
        env:
          CREDENTIALS: ${{ secrets.CREDENTIALS }}
        run: |
          echo "$CREDENTIALS" > credentials.json

      - name: Execute Python Script
        env:
          app_password: ${{ secrets.APP_PASSWORD }}
        run: python email_engine.py

      - name: Clean up sensitive files
        if: always()
        run: rm -f credentials.json