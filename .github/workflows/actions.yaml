name: Run email_engine.py

on:
  schedule:
    - cron: '*/5 * * * *'  # Runs every 5 minutes (GitHub cron uses UTC)
  workflow_dispatch:        # Enables manual "Run workflow" button in Actions tab

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # Safety net so a stuck run doesn't burn Action minutes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create credentials.json from secret
        env:
          CREDENTIALS: ${{ secrets.CREDENTIALS }}
        run: echo "$CREDENTIALS" > credentials.json

      - name: Run email_engine.py
        env:
          app_password: ${{ secrets.APP_PASSWORD }}
        run: python email_engine.py

      - name: Clean up sensitive files
        if: always()
        run: rm -f credentials.json
